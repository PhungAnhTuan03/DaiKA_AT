<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tìm Việc Làm - JobSearch</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <h1>JobSearch</h1>
        </div>
    </header>

    <div class="container">
        <!-- Search Bar -->
        <div class="search-bar">
            <input type="text" class="search-input" placeholder="Nhập vị trí, từ khóa hoặc công ty...">
        </div>

        <!-- Filters -->
        <div class="filters">
            <div class="filter-item">
                <select>
                    <option>Loại hình công việc</option>
                    <option>Toàn thời gian</option>
                    <option>Bán thời gian</option>
                    <option>Thực tập</option>
                </select>
            </div>
            <div class="filter-item">
                <select>
                    <option>Địa điểm</option>
                    <option>Hà Nội</option>
                    <option>TP HCM</option>
                    <option>Đà Nẵng</option>
                </select>
            </div>
            <div class="filter-item">
                <select>
                    <option>Ngành nghề</option>
                    <option>IT/Phần mềm</option>
                    <option>Kế toán</option>
                    <option>Marketing</option>
                </select>
            </div>
        </div>

        <!-- Job Listings -->
        <div class="job-list">
            <!-- Job Card 1 -->
            <div class="job-card">
                <div class="job-info">
                    <h3>Lập Trình Viên Front-end</h3>
                    <p>Công ty Tech Solutions</p>
                    <p>Hà Nội</p>
                </div>
                <div class="job-details">
                    <div class="salary">$1000 - $1500</div>
                    <button class="apply-btn">Ứng tuyển ngay</button>
                    <p>Đăng 2 giờ trước</p>
                </div>
            </div>

            <!-- Job Card 2 -->
            <div class="job-card">
                <div class="job-info">
                    <h3>Kế Toán Trưởng</h3>
                    <p>Công ty Tài Chính ABC</p>
                    <p>TP Hồ Chí Minh</p>
                </div>
                <div class="job-details">
                    <div class="salary">$1200 - $1800</div>
                    <button class="apply-btn">Ứng tuyển ngay</button>
                    <p>Đăng 1 ngày trước</p>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
